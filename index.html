<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mocassin Ivoire</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<meta property="og:title" content="Mocassin Ivoire">
<meta property="og:description" content="L'élégance à vos pas. Mocassins livrés en Côte d'Ivoire.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://mocassinsivoire.github.io/logo.png">
<style>
:root{--bg:#0e0c09;--card:#1a1610;--ink:#f6efe2;--mute:#a89f8c;--gold:#d4a64a;--gold2:#f1d38b;--line:#3b3023;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:0 14px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:8px 0;border-bottom:2px solid var(--gold)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:46px;height:46px;border-radius:50%;object-fit:cover}
.brand b{font-family:'Playfair Display',Georgia,serif;font-size:1.1rem;color:var(--gold2);line-height:1.1;display:block}
.brand small{color:var(--mute);font-size:.7rem;letter-spacing:.06em}
.btns{display:flex;gap:6px;flex:none}
.b{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:700;font-size:.85rem}
#cartbtn{background:var(--gold);color:#1a1205;border-color:var(--gold)}
#cartbtn span{background:#1a1205;color:var(--gold2);border-radius:10px;padding:0 7px;margin-left:6px;font-size:.8rem}
#q{width:100%;margin-top:8px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.hero{text-align:center;padding:22px 0 6px}
.hero img{width:150px;height:150px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--gold),0 12px 30px rgba(212,166,74,.25)}
.hero h1{font-family:'Playfair Display',Georgia,serif;font-size:1.5rem;margin:14px 0 4px;color:var(--gold2)}
.hero p{margin:0;color:var(--mute)}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.trust div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:.72rem;color:var(--mute);line-height:1.35}
.st{font-family:'Playfair Display',Georgia,serif;color:var(--gold2);font-size:1.25rem;margin:20px 0 0;display:flex;align-items:center;gap:10px}
.st::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px 0 24px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.p{background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.pic{font-size:3.4rem;text-align:center;padding:22px 0;background:radial-gradient(circle at 50% 40%,#2a2218,#14110c)}
.inf{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.inf h3{margin:0;font-size:.92rem;font-weight:700}
.old{color:var(--mute);text-decoration:line-through;font-size:.8rem}
.pr{font-weight:900;color:var(--gold2)}
.tag{font-size:.75rem;color:var(--gold);font-weight:700}
.add{margin-top:auto;background:var(--gold);color:#1a1205;border:0;border-radius:10px;padding:10px;font-weight:900;font-size:.9rem}
.share{border-top:1px solid var(--line);padding:16px 0 18px}
.sr{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.shl{width:100%;margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:.85rem}
#shmsg{display:block;color:var(--gold2);font-weight:700;margin-top:6px}
.foot{text-align:center;color:var(--mute);font-size:.8rem;padding:6px 14px 28px}
.foot a{color:var(--gold2)}
#panel{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:10}
#panel.on{display:block}
.sheet{position:absolute;right:0;top:0;bottom:0;width:min(100%,400px);background:var(--bg);padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));overflow:auto;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:10px}
.row button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;width:28px;height:28px;font-size:1rem}
.tot{font-weight:900;font-size:1.2rem;display:flex;justify-content:space-between}
.sheet input{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.go{background:var(--gold);color:#1a1205;border:0;border-radius:12px;padding:13px;font-weight:900;font-size:1rem}
.close{align-self:flex-end;background:none;border:0;color:var(--ink);font-size:1.6rem}
.ok{background:#1f3a24;color:#d9f5dc;border-radius:12px;padding:14px;font-weight:700}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <div class="brand"><img src="logo.png" alt="" onerror="this.style.display='none'"><div><b>Mocassin Ivoire</b><small>L'ÉLÉGANCE À VOS PAS</small></div></div>
    <div class="btns"><button class="b" id="accbtn" aria-label="Mon compte">👤</button><button class="b" id="cartbtn" aria-label="Ouvrir le panier">Panier<span id="n">0</span></button></div>
  </div>
  <input id="q" type="search" placeholder="Rechercher un mocassin" aria-label="Rechercher">
</div></header>
<main class="wrap">
  <section class="hero">
    <img src="logo.png" alt="Mocassin Ivoire" onerror="this.style.display='none'">
    <h1>L'élégance à vos pas</h1>
    <p>Mocassins livrés en Côte d'Ivoire</p>
  </section>
  <div class="trust"><div>🚚<br>Livraison<br>en Côte d'Ivoire</div><div>💳<br>Paiement à la<br>livraison</div><div>💬<br>Commande<br>par WhatsApp</div></div>
  <h2 class="st">Nos mocassins</h2>
  <div class="grid" id="grid"></div>
  <div class="share"><b>Partage la boutique</b><div class="sr"><button class="b" data-sh="native">📤 Partager</button><button class="b" data-sh="cp">Copier le lien</button></div><input id="shl" class="shl" readonly aria-label="Lien de la boutique"><small id="shmsg" role="status"></small></div>
</main>
<footer class="foot">© Mocassin Ivoire · <a href="https://wa.me/2250585285278" target="_blank" rel="noopener">Nous écrire sur WhatsApp</a></footer>
<div id="panel"><div class="sheet" id="sheet"></div></div>
<script>
const P=[
 {n:'Mocassin cuir noir classique',p:25000,e:'👞'},
 {n:'Mocassin cuir marron',p:25000,e:'👞'},
 {n:'Mocassin bordeaux élégant',p:28000,e:'👞'},
 {n:'Mocassin daim bleu nuit',p:30000,o:35000,e:'👞'}
];
let q='',cart={};
const f=n=>n.toLocaleString('fr-FR')+' FCFA';
const $=i=>document.getElementById(i);
function grid(){
 const l=P.map((x,i)=>({...x,i})).filter(x=>x.n.toLowerCase().includes(q));
 $('grid').innerHTML=l.length?l.map(x=>`<div class="p"><div class="pic" aria-hidden="true">${x.e}</div><div class="inf"><h3>${x.n}</h3>${x.o?`<span class="old">${f(x.o)}</span><span class="tag">-${Math.round(100-x.p/x.o*100)}%</span>`:''}<span class="pr">${f(x.p)}</span><button class="add" data-i="${x.i}">Ajouter au panier</button></div></div>`).join(''):'<p>Aucun mocassin trouvé. Essaie un autre mot.</p>';
}
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const total=()=>Object.entries(cart).reduce((a,[i,k])=>a+P[i].p*k,0);
const WA='2250585285278';
let U={},H=[];
try{U=JSON.parse(localStorage.getItem('miU')||'{}');H=JSON.parse(localStorage.getItem('miH')||'[]');}catch(e){}
const sv=()=>{try{localStorage.setItem('miU',JSON.stringify(U));localStorage.setItem('miH',JSON.stringify(H));}catch(e){}};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
function acct(msg){
 $('sheet').innerHTML=`<button class="close" data-x="1" aria-label="Fermer">×</button><h2 style="margin:0">Mon compte</h2>${msg?`<div class="ok">${msg}</div>`:''}<input id="an" placeholder="Nom" autocomplete="name" value="${esc(U.n)}"><input id="ap" placeholder="Téléphone" inputmode="tel" autocomplete="tel" value="${esc(U.p)}"><input id="aq" placeholder="Commune / quartier" value="${esc(U.a)}"><button class="go" data-sv="1">Enregistrer</button>`+(H.length?`<h3 style="margin:8px 0 0">Mes commandes</h3>`+H.slice().reverse().map(o=>`<div class="row"><span>${esc(o.d)}<br><small>${esc(o.l)}</small></span><b>${f(o.t)}</b></div>`).join(''):'');
 $('panel').classList.add('on');
}
function sheet(done,url){
 const items=Object.entries(cart);
 $('sheet').innerHTML=`<button class="close" data-x="1" aria-label="Fermer">×</button><h2 style="margin:0">Mon panier</h2>`+
 (done?`<div class="ok">Ta commande est prête. Appuie sur le bouton pour l'envoyer sur WhatsApp : nous te confirmons la livraison.</div><a class="go" style="text-align:center;text-decoration:none" href="${url}" target="_blank" rel="noopener">Envoyer sur WhatsApp</a>`:
 items.length?items.map(([i,k])=>`<div class="row"><span>${P[i].e} ${P[i].n}<br><b>${f(P[i].p*k)}</b></span><span><button data-m="${i}" aria-label="Retirer">−</button> ${k} <button data-a="${i}" aria-label="Ajouter">+</button></span></div>`).join('')+
 `<div class="tot"><span>Total</span><span>${f(total())}</span></div><input id="nm" placeholder="Nom" autocomplete="name" value="${esc(U.n)}"><input id="ph" placeholder="Téléphone" inputmode="tel" autocomplete="tel" value="${esc(U.p)}"><input id="ad" placeholder="Commune / quartier (ex : Cocody, Angré)" value="${esc(U.a)}"><input id="pt" placeholder="Pointure (ex : 42)" inputmode="numeric" value="${esc(U.t)}"><button class="go" data-go="1">Commander (paiement à la livraison)</button>`
 :'<p>Ton panier est vide. Ajoute un mocassin pour commencer.</p>');
}
const SITE=location.href.split('#')[0].split('?')[0];
function share(k){
 const t='Mocassin Ivoire : l\'élégance à vos pas. Commandez en ligne, livraison en Côte d\'Ivoire.',m=$('shmsg'),i=$('shl');
 const copy=()=>{i.focus();i.select();i.setSelectionRange(0,999);
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}
  if(ok){m.textContent='Lien copié !';return;}
  try{navigator.clipboard.writeText(SITE).then(()=>{m.textContent='Lien copié !';},()=>{m.textContent='Appuie longuement sur le lien ci-dessus pour le copier.';});}
  catch(e){m.textContent='Appuie longuement sur le lien ci-dessus pour le copier.';}};
 if(k==='native'&&navigator.share){navigator.share({title:'Mocassin Ivoire',text:t,url:SITE}).catch(er=>{if(er&&er.name!=='AbortError')copy();});return;}
 copy();
}
$('shl').value=SITE;
document.addEventListener('click',e=>{
 const t=e.target.closest('button,#panel');if(!t)return;const d=t.dataset||{};
 if(d.i!==undefined){cart[d.i]=(cart[d.i]||0)+1;upd();}
 else if(d.a){cart[d.a]++;upd();sheet();}
 else if(d.m){if(--cart[d.m]<=0)delete cart[d.m];upd();sheet();}
 else if(t.id==='cartbtn'){sheet();$('panel').classList.add('on');}
 else if(d.x||t.id==='panel'){if(e.target.id==='panel'||d.x)$('panel').classList.remove('on');}
 else if(d.sh){share(d.sh);}
 else if(t.id==='accbtn'){acct();}
 else if(d.sv){U={...U,n:$('an').value.trim(),p:$('ap').value.trim(),a:$('aq').value.trim()};sv();acct('Compte enregistré.');}
 else if(d.go){
  if(!$('nm').value.trim()||!$('ph').value.trim()||!$('ad').value.trim()||!$('pt').value.trim()){$('pt').placeholder='Remplis tous les champs';return;}
  const L=Object.entries(cart).map(([i,k])=>'- '+k+' x '+P[i].n+' : '+f(P[i].p*k)).join('\n');
  const msg='Bonjour Mocassin Ivoire, je veux commander :\n'+L+'\n\nTotal : '+f(total())+'\nPaiement : à la livraison\n\nNom : '+$('nm').value.trim()+'\nTéléphone : '+$('ph').value.trim()+'\nQuartier : '+$('ad').value.trim()+'\nPointure : '+$('pt').value.trim();
  const url='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);
  U={n:$('nm').value.trim(),p:$('ph').value.trim(),a:$('ad').value.trim(),t:$('pt').value.trim()};
  H.push({d:new Date().toLocaleDateString('fr-FR'),l:Object.entries(cart).map(([i,k])=>k+' x '+P[i].n).join(', '),t:total()});sv();
  cart={};upd();sheet(true,url);}
});
function upd(){$('n').textContent=count();}
$('q').addEventListener('input',e=>{q=e.target.value.toLowerCase();grid();});
grid();
(l=>{l.rel='icon';l.href='logo.png';document.head.appendChild(l)})(document.createElement('link'));
</script>
</body>
</html>
